plugins { id 'com.android.application' version '8.7.3' }
android {
    namespace 'ca.ranger.ecu'
    compileSdk 35
    defaultConfig {
        applicationId 'ca.ranger.ecu'
        minSdk 23
        targetSdk 33
        versionCode 150
        versionName '1.4.0'
    }
    signingConfigs {
        release {
            def signingPath = System.getenv('RANGER_KEYSTORE')
            if (signingPath) {
                storeFile file(signingPath)
                storePassword System.getenv('RANGER_KEYSTORE_PASSWORD')
                keyAlias 'ranger-ecu-studio'
                keyPassword System.getenv('RANGER_KEYSTORE_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies { implementation 'com.github.mik3y:usb-serial-for-android:3.9.0' }
